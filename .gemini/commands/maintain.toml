# .gemini/commands/maintain.toml
description = "Autonomously resolve all open GitHub issues and monitor PRs until mergeable."
prompt = """
Act as an autonomous Lead Maintainer. Your objective is to resolve all open GitHub issues in this repository by following the Specification-Driven Development (SDD) workflow defined in `agents.md`.

1. **Context & Triage**:
   - Sync with the `main` branch.
   - Internalize project standards, architecture, and the "Definition of Done" from `agents.md`.
   - Use your native `gh` integration to fetch all open issues.

2. **Implementation Loop**:
   - For each issue, initiate your agentic loop:
     - **Branch**: Create a feature branch (e.g., `fix/issue-<id>`).
     - **Specify**: Draft a technical spec in `.tasks/<id>/spec.md`. Do not write code until the spec is finalized.
     - **Execute**: Load required skills from `.skills/` on demand. Implement the fix and corresponding tests.
     - **Zero-Debt Pass**: Fix all local test failures and linter warnings. You must also resolve pre-existing lint/style errors in any file you modify.
     - **Submit**: Open a Pull Request using `gh pr create --fill`.

3. **Watchtower & Self-Healing (Continuous Monitoring)**:
   - For every active PR, initiate a monitoring cycle:
     - **Check**: Use `gh pr status` to inspect CI logs, security scans, and human comments.
     - **Wait**: To optimize token usage and allow CI to run, execute `!{ sleep 300 }` (5 minutes) between status checks.
     - **Heal**: If CI fails or feedback is provided, treat the logs/comments as high-priority sub-tasks. Autonomously fix the code, push updates, and re-verify.
     - **Loop**: Continue until the PR is green, approved, and "Mergeable."

4. **Escalation**:
   - If an issue is fundamentally unfixable (e.g., upstream dependency break), document the root cause in a local `BLOCKERS.md` and as a PR comment before proceeding to the next issue.

**Operational Mode**: Full Autonomy. Manage all `git` and `gh` plumbing natively. Do not interrupt for permission to fix CI failures; assume full ownership of the lifecycle.
"""
