# TinyDiT Training Configuration
# Usage:
#   python src/train_dit.py --config configs/dit_train_config.yaml
#   modal run src/train_dit.py --config configs/dit_train_config.yaml

model:
  image_size: 128
  patch_size: 16
  embed_dim: 384
  depth: 12
  num_heads: 6

training:
  steps: 100000
  batch_size: 512
  lr: 5e-5
  min_lr: 1e-6
  warmup_steps: 2000
  gradient_clip: 1.0
  gradient_accumulation_steps: 1
  mixed_precision: true
  seed: 42

early_stopping:
  patience: 10
  min_delta: 0.001

ema:
  beta: 0.9999

augmentation:
  level: full

logging:
  log_interval: 100
  save_interval: 10000
  sample_interval: 5000
