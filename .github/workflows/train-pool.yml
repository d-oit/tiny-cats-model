# .github/workflows/train-pool.yml
# GPU-pool training with GitHub Actions as the CONTROL PLANE (issue #163 WP5/WP6).
#
# Architecture (ADR-065):
#   - GitHub Actions plans bounded training slices and launches real GPU
#     provider sessions; it never trains on CPU itself.
#   - Only providers with a real headless adapter (currently Modal) are
#     launched; every other provider FAILS CLEARLY via `providers.py gate`
#     instead of silently simulating on CPU.
#   - HF Hub is the state transport (checkpoints/pool/<exp>/latest pointer);
#     each slice resumes exactly to its global target and reports a
#     machine-readable provider_report_<target>.json artifact.
#
# Usage:
#   gh workflow run train-pool.yml                                  # 400k plan, 25k slices
#   gh workflow run train-pool.yml -f steps=400000 -f slice_size=60000
#   gh workflow run train-pool.yml -f provider=kaggle               # fails clearly (gate)
#
# See: src/providers.py, src/gpu_pool.py, plans/ADR-065-*

name: Train (GPU Pool)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to launch (modal is the only headless adapter; others fail clearly)"
        required: false
        default: "modal"
        type: string
      steps:
        description: "Global training target (slices resume toward this, never additive)"
        required: false
        default: "400000"
        type: string
      slice_size:
        description: "Max steps per provider session (bounded slice; fits the 6h schedule window)"
        required: false
        default: "25000"
        type: string
      batch_size:
        description: "Batch size"
        required: false
        default: "32"
        type: string
      lr:
        description: "Learning rate"
        required: false
        default: "5e-5"
        type: string
      gpu_model:
        description: "GPU model reported in provider reports"
        required: false
        default: "T4"
        type: string
      hub_resume:
        description: "Pull checkpoint from HF Hub before training"
        required: false
        default: true
        type: boolean
      push_to_hub:
        description: "Push checkpoint to HF Hub after training"
        required: false
        default: true
        type: boolean
      hub_push_interval:
        description: "Mid-run HF Hub push cadence (steps; 0 disables). Capped so cancelled slices still sync checkpoints."
        required: false
        default: "5000"
        type: string
  schedule:
    # Run pool training every 6 hours to maximize free GPU usage.
    # On schedule, defaults to modal provider (first in chain).
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-training
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────
  # Plan: turn the global target into a bounded slice matrix (WP6)
  # ────────────────────────────────────────────────────────
  plan-slices:
    name: Plan slices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install huggingface_hub

      - name: Compute slice matrix
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          EXTRA=()
          if [ -n "$HF_TOKEN" ]; then
            EXTRA+=(--remote-completed --token "$HF_TOKEN")
          fi
          MATRIX="$(python src/providers.py plan \
            --steps ${{ github.event.inputs.steps || '400000' }} \
            --slice-size ${{ github.event.inputs.slice_size || '25000' }} \
            --experiment-id dit-breed-conditioned-v4 \
            --hub-repo d4oit/tiny-cats-model \
            "${EXTRA[@]}")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Planned slices: $MATRIX"

  # ────────────────────────────────────────────────────────
  # Provider support gate (WP5): unsupported providers fail clearly
  # instead of silently training on CPU (replaces train-pool-runner).
  # ────────────────────────────────────────────────────────
  provider-gate:
    name: Provider support gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.provider != 'modal'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gate provider
        run: |
          if [ "${{ inputs.provider }}" = "all" ]; then
            python src/providers.py gate --provider all
          else
            python src/providers.py gate --provider "${{ inputs.provider }}" --strict
          fi

  # ────────────────────────────────────────────────────────
  # Train slices: one bounded Modal GPU session per slice target,
  # run sequentially (max-parallel: 1) with fail-fast so a broken
  # slice never lets a later one run on stale state.
  # ────────────────────────────────────────────────────────
  train-slice:
    name: Slice → ${{ matrix.target }}
    # Never launch a slice when an unsupported provider was requested: the
    # provider gate runs for every non-modal provider, so a `skipped` gate is
    # the (only) signal that modal was actually requested. `always()` keeps the
    # matrix alive when the gate is skipped rather than failed.
    needs: [plan-slices, provider-gate]
    if: |
      always() &&
      needs.plan-slices.result == 'success' &&
      needs.provider-gate.result == 'skipped'
    runs-on: ubuntu-latest
    environment: modal-training
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJson(needs.plan-slices.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install modal
          pip install -r requirements.txt

      - name: Ensure Modal HuggingFace secret
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN is unset; Hub checkpoint sync will degrade gracefully"
            exit 0
          fi
          # Always refresh the Modal secret from the current GitHub secret.
          # Skipping when it already existed let a rotated/expired HF_TOKEN
          # linger inside the container, silently breaking Hub pulls — which is
          # how every 2026-09-24 slice fell back to a stale local checkpoint and
          # died on the manifest gate. `--force` overwrites an existing secret.
          modal secret create --force huggingface-secret HF_TOKEN="$HF_TOKEN" \
            || echo "::warning::Failed to sync Modal secret 'huggingface-secret'"

      - name: Launch slice on Modal GPU
        id: train
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          HUBFLAGS=()
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event.inputs.hub_resume }}" = "true" ]; then
            HUBFLAGS+=(--hub-resume)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.push_to_hub }}" != "true" ]; then
            HUBFLAGS+=(--no-hub-push)
          fi
          CMD="$(python src/providers.py launch \
            --provider modal \
            --target ${{ matrix.target }} \
            --batch-size ${{ github.event.inputs.batch_size || '32' }} \
            --lr ${{ github.event.inputs.lr || '5e-5' }} \
            --save-interval 500 \
            --hub-push-interval ${{ github.event.inputs.hub_push_interval || '5000' }} \
            --experiment-id dit-breed-conditioned-v4 \
            "${HUBFLAGS[@]}")"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Launch: $CMD"
          eval "$CMD" 2>&1 | tee modal-training.log

      - name: Write provider report
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          modal volume get dit-outputs checkpoints/pool/training_state.json \
            ./training_state.json \
            || echo "::warning::training_state.json not on volume yet"
          python src/providers.py report \
            --provider modal \
            --gpu-model ${{ github.event.inputs.gpu_model || 'T4' }} \
            --job-id "${{ github.run_id }}/${{ github.job }}/${{ matrix.target }}" \
            --started-at "${{ steps.train.outputs.started_at }}" \
            --ended-at "$ENDED_AT" \
            --target ${{ matrix.target }} \
            --state-file training_state.json \
            --checkpoint-uri "hf://d4oit/tiny-cats-model/checkpoints/pool/dit-breed-conditioned-v4/latest" \
            --outcome "${{ steps.train.outcome }}" \
            --out "provider_report_${{ matrix.target }}.json"

      - name: Verify slice checkpoint
        id: verify
        if: always()
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -o pipefail
          mkdir -p verify
          modal volume get dit-outputs checkpoints/pool/dit_model.pt verify/dit_model.pt \
            2>&1 | tee -a modal-training.log \
            || echo "::warning::dit_model.pt not on volume for this slice"
          set +e
          python src/providers.py verify \
            --state-file training_state.json \
            --checkpoint verify/dit_model.pt \
            --target ${{ matrix.target }} \
            --out slice_verification_${{ matrix.target }}.json
          rc=$?
          set -e
          echo "verify_exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 1 = no usable checkpoint. A later slice would resume from stale
          # state, so fail loudly (WP7: never report success on a failed run).
          if [ "$rc" = "1" ]; then
            echo "::error::slice ${{ matrix.target }} produced no usable checkpoint"
            exit 1
          fi
          # 3 = valid but short of target (preemption/interruption). The
          # checkpoint is resumable by design, so continue to the next slice.
          if [ "$rc" = "3" ]; then
            echo "::warning::slice ${{ matrix.target }} is partial — checkpoint is resumable"
          fi

      - name: Upload training log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: modal-training-log-${{ matrix.target }}
          path: modal-training.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload provider report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-report-${{ matrix.target }}
          path: |
            provider_report_${{ matrix.target }}.json
            slice_verification_${{ matrix.target }}.json
          retention-days: 30
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────
  # Pool status summary
  # ────────────────────────────────────────────────────────
  pool-summary:
    name: Pool Summary
    runs-on: ubuntu-latest
    needs: [plan-slices, train-slice, provider-gate]
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Print pool summary
        env:
          # GitHub renders booleans in ${{ }} as bare true/false, which would
          # break when interpolated into Python source. Pass the string via a
          # step env var instead; read it with os.environ below.
          SLICES_SUCCEEDED: ${{ needs.train-slice.result == 'success' }}
          SLICES_RESULT: ${{ needs.train-slice.result }}
          GATE_RESULT: ${{ needs.provider-gate.result }}
          PLANNED: ${{ needs.plan-slices.outputs.matrix }}
        run: |
          # shellcheck disable=SC2140  # Python -c block uses escaped quotes
          python -c "
          import json, os, sys; sys.path.insert(0, 'src')
          from gpu_pool import FALLBACK_CHAIN, estimate_cost
          print('=' * 60)
          print('GPU POOL TRAINING COMPLETE')
          print('=' * 60)
          chain = ' → '.join(p.value for p in FALLBACK_CHAIN)
          print(f'Fallback chain: {chain}')
          print(f'Planned slices: {os.environ.get(\"PLANNED\", \"?\")}')
          print()
          print('Cost estimates (20k steps):')
          costs = estimate_cost(20000)
          for name, info in sorted(costs.items()):
              flag = '✅ FREE' if info['within_free_tier'] else '⚠️  PAID'
              print(f'  {info[\"provider\"]:20s} | {info[\"gpu_hours\"]:6.1f}h | \${info[\"estimated_cost\"]:7.2f} | {flag}')
          print()
          print('Checkpoints synced via HuggingFace Hub:')
          print('  https://huggingface.co/d4oit/tiny-cats-model/tree/main/checkpoints/pool')
          print()
          # shellcheck disable=SC2140  # GHA expression, not shell quoting
          gate = os.environ.get('GATE_RESULT', '')
          result = os.environ.get('SLICES_RESULT', '')
          if gate == 'failed':
              print('❌ Provider gate failed — no slice was launched (see gate job)')
          elif result == 'skipped':
              print('ℹ️  No slice ran (unsupported provider or failed gate)')
          elif result == 'success':
              print('✅ Slices completed — provider reports uploaded as artifacts')
              print('   exit reasons are recorded per slice in provider-report-* artifacts')
          else:
              # The failing slice already failed the workflow; just be explicit
              # here instead of reporting a vacuous success.
              print('❌ One or more slices failed (see provider-report-* artifacts)')
          "

      - name: Verify Hub checkpoints
        # Only meaningful when the run was supposed to push: schedule always
        # pushes, dispatch does unless push_to_hub was set to false.
        if: |
          github.event_name == 'schedule' ||
          inputs.push_to_hub == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import json, os, sys, urllib.request
          token = os.environ.get('HF_TOKEN', '')
          repo = 'd4oit/tiny-cats-model'
          url = f'https://huggingface.co/api/models/{repo}/tree/main/checkpoints/pool'
          req = urllib.request.Request(url)
          if token:
              req.add_header('Authorization', f'Bearer {token}')
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  items = json.load(resp)
          except Exception as e:
              print(f'⚠️  Could not list Hub checkpoints: {e}')
              sys.exit(1)
          if not items:
              print('⚠️  No checkpoints found under checkpoints/pool')
              sys.exit(1)
          for it in items:
              print(f'  {it.get(\"path\")}  ({it.get(\"size\", \"?\")}B)')
          print(f'✅ {len(items)} checkpoint(s) present on Hub')
          "
