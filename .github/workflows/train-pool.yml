# .github/workflows/train-pool.yml
# GPU-pool training with GitHub Actions as the CONTROL PLANE (issue #163 WP5/WP6).
#
# Architecture (ADR-065):
#   - GitHub Actions plans bounded training slices and launches real GPU
#     provider sessions; it never trains on CPU itself.
#   - Kaggle and eligibility-approved Lightning are the automatic providers;
#     Modal is not part of this free-only workflow.
#     `provider=auto` falls back only on a definite prelaunch refusal.
#   - HF Hub is the state transport (checkpoints/pool/<exp>/latest pointer);
#     each slice resumes exactly to its global target and reports a
#     machine-readable provider_report_<target>.json artifact.
#
# Usage:
#   gh workflow run train-pool.yml -f provider=auto                 # free-only order
#   gh workflow run train-pool.yml -f steps=615000 -f slice_size=15000
#   gh workflow run train-pool.yml -f provider=modal                # rejected
#
# See: src/providers.py, src/gpu_pool.py, plans/ADR-065-*

name: Train (GPU Pool)

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider: auto (Kaggle → Lightning), kaggle, or lightning; modal/all are rejected as paid"
        required: false
        default: "auto"
        type: string
      steps:
        description: "Global training target (slices resume toward this, never additive)"
        required: false
        # 400k was reached and released on 2026-09-25 (tag checkpoint-400k);
        # the pool now trains toward the next milestone. Keep this fallback
        # below in sync — scheduled runs read it, not `inputs.steps`.
        default: "600000"
        type: string
      slice_size:
        # 25000 never fit: at the measured T4 rate of 1.16 steps/s it is 5.99h of
        # pure training, so setup + checkpoint saves + hub pushes always pushed a
        # slice past the 360-minute job cap and it was killed mid-work (2026-10-01:
        # three full 6h slices only moved the pool 406k -> 434k). 15000 leaves
        # headroom so a slice exits cleanly with verified progress.
        description: "Max steps per provider session (bounded slice; fits the 6h schedule window)"
        required: false
        default: "15000"
        type: string
      batch_size:
        description: "Batch size"
        required: false
        default: "32"
        type: string
      lr:
        description: "Learning rate"
        required: false
        default: "5e-5"
        type: string
      gpu_model:
        description: "GPU model reported in provider reports"
        required: false
        default: "T4"
        type: string
      hub_resume:
        description: "Pull checkpoint from HF Hub before training"
        required: false
        default: true
        type: boolean
      push_to_hub:
        description: "Push checkpoint to HF Hub after training"
        required: false
        default: true
        type: boolean
      hub_push_interval:
        description: "Mid-run HF Hub push cadence (steps; 0 disables). Capped so cancelled slices still sync checkpoints."
        required: false
        default: "5000"
        type: string
      allow_experiment_mismatch:
        description: "Explicit one-off migration: resume a checkpoint whose manifest differs (issue #163). Leave false."
        required: false
        default: false
        type: boolean
  schedule:
    # On schedule, the free-only default is Kaggle, then eligible Lightning.
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-training
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────
  # Plan: turn the global target into a bounded slice matrix (WP6)
  # ────────────────────────────────────────────────────────
  plan-slices:
    name: Plan slices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      completed_steps: ${{ steps.plan.outputs.completed_steps }}
      campaign_complete: ${{ steps.plan.outputs.campaign_complete }}
      slice_count: ${{ steps.plan.outputs.slice_count }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install huggingface_hub

      - name: Compute slice matrix
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is required to resume this campaign from its canonical Hub pointer"
            exit 1
          fi
          MATRIX="$(python src/providers.py plan \
            --steps ${{ github.event.inputs.steps || '600000' }} \
            --slice-size ${{ github.event.inputs.slice_size || '15000' }} \
            --experiment-id dit-breed-conditioned-v4 \
            --hub-repo d4oit/tiny-cats-model \
            --remote-completed \
            --token "$HF_TOKEN" \
            --github-output "$GITHUB_OUTPUT")"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Planned slices: $MATRIX"

  # ────────────────────────────────────────────────────────
  # Provider support gate (WP5): unsupported providers fail clearly
  # instead of silently training on CPU (replaces train-pool-runner).
  # ────────────────────────────────────────────────────────
  provider-gate:
    name: Provider support gate
    needs: [plan-slices]
    if: |
      needs.plan-slices.result == 'success' &&
      needs.plan-slices.outputs.campaign_complete != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Gate free-only provider
        env:
          PROVIDER: ${{ inputs.provider || 'auto' }}
        run: |
          set -euo pipefail
          if [ "$PROVIDER" = "modal" ] || [ "$PROVIDER" = "all" ]; then
            echo "::error::Paid provider '$PROVIDER' is disabled in this free-only workflow. Choose auto, kaggle, or lightning."
            exit 1
          fi
          python src/providers.py gate --provider "$PROVIDER" --strict

  # ────────────────────────────────────────────────────────
  # Train slices: one bounded free-provider session per target, sequentially
  # (max-parallel: 1) with fail-fast so later slices never resume stale state.
  # ────────────────────────────────────────────────────────
  train-slice:
    name: Slice → ${{ matrix.target }}
    # Completed campaigns retain the nonempty sentinel matrix but never
    # allocate a provider session; their provider gate is skipped too.
    needs: [plan-slices, provider-gate]
    if: |
      always() &&
      needs.plan-slices.result == 'success' &&
      needs.plan-slices.outputs.campaign_complete != 'true' &&
      needs.provider-gate.result == 'success'
    runs-on: ubuntu-latest
    environment: modal-training
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJson(needs.plan-slices.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt


      - name: Record and validate canonical pointer
        id: pointer_before
        if: |
          github.event_name == 'schedule' ||
          inputs.push_to_hub == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          RECORD="pool_pointer_${{ matrix.target }}.json"
          python scripts/check_pool_pointer.py \
            --record "$RECORD" \
            --hub-repo d4oit/tiny-cats-model \
            --experiment-id dit-breed-conditioned-v4
          python - "$RECORD" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              pointer = json.load(source)
          if pointer.get("recorded_failure") or pointer.get("pointer_found") is not True:
              raise SystemExit("required canonical pre-slice pointer is unavailable")
          print(f"Validated canonical pointer at step {pointer['completed_steps']}")
          PY

      - name: Launch slice on the selected provider
        id: train
        env:
          PROVIDER: ${{ inputs.provider || 'auto' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KERNEL_ID: ${{ vars.KAGGLE_KERNEL_ID }}
          KAGGLE_HF_TOKEN_DATASET: ${{ vars.KAGGLE_HF_TOKEN_DATASET }}
          LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
          LIGHTNING_TEAMSPACE: ${{ vars.LIGHTNING_TEAMSPACE }}
          LIGHTNING_FREE_ONLY_VERIFIED: ${{ vars.LIGHTNING_FREE_ONLY_VERIFIED }}
        run: |
          set -euo pipefail
          HUBFLAGS=()
          if [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ inputs.hub_resume }}" = "true" ]; then
            HUBFLAGS+=(--hub-resume)
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.push_to_hub }}" != "true" ]; then
            HUBFLAGS+=(--no-hub-push)
          fi
          MIGRATEFLAGS=()
          if [ "${{ inputs.allow_experiment_mismatch }}" = "true" ]; then
            MIGRATEFLAGS+=(--allow-experiment-mismatch)
          fi
          LRFLAGS=()
          # Keep MIN_LR at the approved 1e-5 floor for this campaign.
          if [ -n "${{ vars.MIN_LR }}" ]; then
            LRFLAGS+=(--min-lr "${{ vars.MIN_LR }}")
          fi
          CMD="$(python src/providers.py launch \
            --provider "$PROVIDER" \
            --kernel-id "${{ vars.KAGGLE_KERNEL_ID }}" \
            --hf-token-dataset "${{ vars.KAGGLE_HF_TOKEN_DATASET }}" \
            --target ${{ matrix.target }} \
            --batch-size ${{ inputs.batch_size || '32' }} \
            --lr ${{ inputs.lr || '5e-5' }} \
            --save-interval 2500 \
            --hub-push-interval ${{ inputs.hub_push_interval || '5000' }} \
            --experiment-id dit-breed-conditioned-v4 \
            --schedule-steps ${{ inputs.steps || '600000' }} \
            "${HUBFLAGS[@]}" "${MIGRATEFLAGS[@]}" "${LRFLAGS[@]}")"
          if [ -z "$CMD" ]; then
            echo "::error::could not build a launch command for provider '$PROVIDER'"
            exit 1
          fi
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Launch: $CMD"
          eval "$CMD" 2>&1 | tee provider-launch.log

      - name: Assert canonical pointer advancement
        id: pointer_after
        if: |
          steps.train.outcome == 'success' &&
          (github.event_name == 'schedule' || inputs.push_to_hub == true)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/check_pool_pointer.py \
            --record-file "pool_pointer_${{ matrix.target }}.json" \
            --target ${{ matrix.target }} \
            --hub-repo d4oit/tiny-cats-model \
            --experiment-id dit-breed-conditioned-v4 \
            --expect-advanced \
            --github-output "$GITHUB_OUTPUT"

      - name: Persist pointer progression evidence
        if: |
          always() &&
          steps.pointer_before.outcome == 'success' &&
          (github.event_name == 'schedule' || inputs.push_to_hub == true)
        env:
          POINTER_FILE: pool_pointer_${{ matrix.target }}.json
          POINTER_AFTER: ${{ steps.pointer_after.outputs.pointer_after }}
          ASSERTION_OUTCOME: ${{ steps.pointer_after.outcome }}
          TRAIN_OUTCOME: ${{ steps.train.outcome }}
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["POINTER_FILE"])
          record = json.loads(path.read_text())
          after = os.environ.get("POINTER_AFTER")
          if not after and int(record["completed_steps"]) >= int(os.environ["TARGET"]):
              after = str(record["completed_steps"])
          record.update(
              pointer_after=int(after) if after else None,
              assertion_outcome=os.environ.get("ASSERTION_OUTCOME"),
              train_outcome=os.environ.get("TRAIN_OUTCOME"),
              target=int(os.environ["TARGET"]),
          )
          path.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n")
          PY

      - name: Annotate slice failure
        if: |
          always() &&
          (steps.train.outcome == 'failure' ||
           steps.pointer_before.outcome == 'failure' ||
           steps.pointer_after.outcome == 'failure')
        run: |
          ERR="$(grep -aiE 'exceeded its spend limit|error' provider-launch.log kaggle-training.log lightning-training.log 2>/dev/null \
            | head -3 | tr '\n' ' ' || true)"
          echo "::error title=Slice ${{ matrix.target }} failed::${ERR:-see provider launch log}"

      - name: Write provider report
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          ENDED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PROVIDER="$(cat .provider-used 2>/dev/null || echo "${{ inputs.provider || 'auto' }}")"
          if [ "$PROVIDER" = "auto" ]; then PROVIDER=kaggle; fi
          python src/providers.py fetch-artifacts \
            --provider "$PROVIDER" --name training_state.json --dest . \
            || echo "::warning::training_state.json not available for $PROVIDER"
          if ! python src/providers.py report \
            --provider "$PROVIDER" \
            --gpu-model ${{ inputs.gpu_model || 'T4' }} \
            --job-id "${{ github.run_id }}/${{ github.job }}/${{ matrix.target }}" \
            --started-at "${{ steps.train.outputs.started_at }}" \
            --ended-at "$ENDED_AT" \
            --target ${{ matrix.target }} \
            --state-file training_state.json \
            --checkpoint-uri "hf://d4oit/tiny-cats-model/checkpoints/pool/dit-breed-conditioned-v4/latest" \
            --outcome "${{ steps.train.outcome }}" \
            --out "provider_report_${{ matrix.target }}.json"; then
            echo "::warning::provider report recorded a non-successful slice; artifact still uploaded"
          fi

      - name: Verify slice checkpoint
        id: verify
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p verify
          PROVIDER="$(cat .provider-used 2>/dev/null || echo "${{ inputs.provider || 'auto' }}")"
          if [ "$PROVIDER" = "auto" ]; then PROVIDER=kaggle; fi
          (python src/providers.py fetch-artifacts \
             --provider "$PROVIDER" --name dit_model.pt --dest verify \
             && echo "fetched dit_model.pt from $PROVIDER") 2>&1 \
            | tee -a provider-launch.log \
            || echo "::warning::dit_model.pt not available for $PROVIDER"
          set +e
          python src/providers.py verify \
            --state-file training_state.json \
            --checkpoint verify/dit_model.pt \
            --target ${{ matrix.target }} \
            --out slice_verification_${{ matrix.target }}.json
          rc=$?
          set -e
          echo "verify_exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "1" ]; then
            echo "::error::slice ${{ matrix.target }} produced no usable checkpoint"
            exit 1
          fi
          if [ "$rc" = "3" ]; then
            echo "::warning::slice ${{ matrix.target }} is partial — checkpoint is resumable"
          fi
      - name: Upload provider training log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-training-log-${{ matrix.target }}
          path: |
            provider-launch.log
            kaggle-training.log
            lightning-training.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload provider report and pointer evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provider-report-${{ matrix.target }}
          path: |
            provider_report_${{ matrix.target }}.json
            slice_verification_${{ matrix.target }}.json
            pool_pointer_${{ matrix.target }}.json
          retention-days: 30
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────
  # Pool status summary
  # ────────────────────────────────────────────────────────
  pool-summary:
    name: Pool Summary
    runs-on: ubuntu-latest
    needs: [plan-slices, train-slice, provider-gate]
    if: always()
    timeout-minutes: 5
    # Only this job may write issues: it maintains the campaign-stall tracker
    # (see "Sync campaign-stall issue" below).
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Print pool summary
        env:
          SLICES_RESULT: ${{ needs.train-slice.result }}
          GATE_RESULT: ${{ needs.provider-gate.result }}
          CAMPAIGN_COMPLETE: ${{ needs.plan-slices.outputs.campaign_complete }}
          SLICE_COUNT: ${{ needs.plan-slices.outputs.slice_count }}
          PLANNED: ${{ needs.plan-slices.outputs.matrix }}
        run: |
          python -c "
          import os, sys; sys.path.insert(0, 'src')
          from providers import AUTO_PROVIDERS
          print('=' * 60)
          print('GPU POOL TRAINING SUMMARY')
          print('=' * 60)
          print('Automatic free-only provider order: ' + ' → '.join(AUTO_PROVIDERS))
          print(f'Planned slices: {os.environ.get(\"SLICE_COUNT\", \"?\")}')
          complete = os.environ.get('CAMPAIGN_COMPLETE', '')
          if complete == 'true':
              print('Planned targets: none (global target already reached)')
          else:
              print(f'Planned targets: {os.environ.get(\"PLANNED\", \"?\")}')
          print()
          print('Checkpoint transport: HuggingFace Hub')
          print('  https://huggingface.co/d4oit/tiny-cats-model/tree/main/checkpoints/pool')
          print()
          gate = os.environ.get('GATE_RESULT', '')
          result = os.environ.get('SLICES_RESULT', '')
          if complete == 'true':
              print('Global target already reached; no GPU slice launched.')
          elif gate == 'failed':
              print('❌ Provider gate failed — no slice was launched (see gate job)')
          elif result == 'skipped':
              print('ℹ️  No slice ran (plan or provider gate was skipped)')
          elif result == 'success':
              print('✅ Slices completed — provider reports uploaded as artifacts')
              print('   exit reasons are recorded per slice in provider-report-* artifacts')
          else:
              print('❌ One or more slices failed (see provider-report-* artifacts)')
          "

      - name: Sync campaign-stall issue
        # A failed free-provider chain must reach a human; healthy runs close
        # the tracker, and unhealthy runs open or update it.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICE_RESULT: ${{ needs.train-slice.result }}
          PLAN_RESULT: ${{ needs.plan-slices.result }}
          GATE_RESULT: ${{ needs.provider-gate.result }}
          CAMPAIGN_COMPLETE: ${{ needs.plan-slices.outputs.campaign_complete }}
          SLICE_COUNT: ${{ needs.plan-slices.outputs.slice_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LABEL="campaign-stall"
          TITLE="Campaign stalled: GPU pool training is not advancing"
          SLICES="${SLICE_COUNT:-0}"

          close_tracker() {
            local numbers
            numbers="$(gh issue list --state open --label "$LABEL" --json number --jq '.[].number')" || return 0
            local number
            for number in $numbers; do
              gh issue close "$number" \
                --comment "Recovered: ${RUN_URL} finished healthy (slices=${SLICES}, slice result=${SLICE_RESULT})." \
                || echo "::warning::could not close stale tracker issue #${number}"
            done
          }

          # A deliberate provider-gate rejection is not a campaign stall.
          if [ "$GATE_RESULT" = "failed" ]; then
            echo "Provider gate rejected this dispatch; no stall signal."
            exit 0
          fi

          # A successful slice or an explicit completed-target plan is healthy.
          if [ "$SLICE_RESULT" = "success" ] || \
             { [ "$PLAN_RESULT" = "success" ] && [ "$CAMPAIGN_COMPLETE" = "true" ]; }; then
            close_tracker
            echo "Campaign healthy (planned slices=${SLICES}); tracker issue cleared if any."
            exit 0
          fi

          BODY="$(printf '%s\n' \
            "The unattended pool run finished without a successful slice." \
            "" \
            "- run: ${RUN_URL}" \
            "- planned slices: ${SLICES} (plan job: ${PLAN_RESULT})" \
            "- slice result: ${SLICE_RESULT}" \
            "" \
            "Inspect the failing slice job for the launch/verification error; raw" \
            "provider logs are attached as provider-training-log-* artifacts." \
          )"

          gh label create "$LABEL" --color b60205 \
            --description "Unattended GPU-pool campaign is stalled" --force >/dev/null
          EXISTING="$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated tracker issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi

      - name: Verify Hub checkpoints
        # Only meaningful when the run was supposed to push: schedule always
        # pushes, dispatch does unless push_to_hub was set to false.
        if: |
          github.event_name == 'schedule' ||
          inputs.push_to_hub == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          import json, os, sys, urllib.request
          token = os.environ.get('HF_TOKEN', '')
          repo = 'd4oit/tiny-cats-model'
          url = f'https://huggingface.co/api/models/{repo}/tree/main/checkpoints/pool'
          req = urllib.request.Request(url)
          if token:
              req.add_header('Authorization', f'Bearer {token}')
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  items = json.load(resp)
          except Exception as e:
              print(f'⚠️  Could not list Hub checkpoints: {e}')
              sys.exit(1)
          if not items:
              print('⚠️  No checkpoints found under checkpoints/pool')
              sys.exit(1)
          for it in items:
              print(f'  {it.get(\"path\")}  ({it.get(\"size\", \"?\")}B)')
          print(f'✅ {len(items)} checkpoint(s) present on Hub')
          "
