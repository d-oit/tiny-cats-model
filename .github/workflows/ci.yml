name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: 'false'

# 2026 Best Practice: Smart concurrency to avoid cancelled runs showing as failures
# Uses PR number for grouping (not branch) to prevent confusion
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tighten GITHUB_TOKEN scope (addresses CodeQL "workflow does not contain
# permissions" alert on this workflow). `contents: read` is sufficient for
# actions/checkout and actions/upload-artifact at v4+. This block is INHERITED
# by every job — override locally with `permissions: { contents: write }` only
# on jobs that need to commit back to the repo (e.g., auto-format commit).
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install lint dependencies
        run: |
          pip install --upgrade pip
          pip install ruff==0.15.9

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run ruff lint
        run: ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest-cov>=4.1.0

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
          # test_gpu_pool.py is discovered automatically by pytest tests/

      - name: GPU pool fallback chain simulation
        run: |
          python scripts/test_fallback_chain.py
          # Exits non-zero if any fallback chain simulation fails

      - name: Benchmark estimate drift check
        run: |
          # Run calibration and verify estimates haven't drifted too far
          python -c "
          import json, subprocess, sys
          proc = subprocess.run(
              [sys.executable, 'scripts/benchmark_estimates.py', '--json'],
              capture_output=True, text=True
          )
          if proc.returncode != 0:
              print('benchmark_estimates.py failed:')
              print(proc.stderr)
              sys.exit(1)
          report = json.loads(proc.stdout)
          num = report.get('num_benchmarks', 0)
          err = abs(report.get('mean_error_pct', 0))
          print(f'Benchmarks: {num}, mean error: {report.get(\"mean_error_pct\", 0):+.1f}%')
          if err > 75:
              print(f'⚠️  Estimate drift is high ({err:.1f}%). Consider tuning T4_STEPS_PER_SECOND.')
              print(f'    Run: python scripts/benchmark_estimates.py --tune')
              # Warn but don't fail CI — benchmarks are still sparse
          else:
              print(f'✅ Estimate drift acceptable ({err:.1f}% ≤ 75%)')
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.11'
        with:
          name: coverage-report
          path: coverage.xml

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy
        run: mypy . --ignore-missing-imports

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, type-check]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: ./frontend/dist
          retention-days: 7

  guardrail-deps:
    # Unconditional guardrail (no `paths:` filter) so every PR triggers it.
    # This makes the check a reliable required-status-check that catches
    # Dependabot bumps to versions that don't exist on PyPI (the bug that
    # caused PR #95 to fail with `onnxruntime>=1.24.3`). Complements PR
    # #96 (version constraint in requirements) and PR #97 (dependabot
    # ignore rule). Pure-shell grep so there's no Python/packaging dep.
    name: Dependency guardrail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Forbid onnxruntime >= 1.24.0 or >= 2.0.0
        run: |
          # Forbid any constraint that allows onnxruntime 1.24+ or 2.x
          # (neither exists on PyPI; latest valid is 1.23.2).
          # `1\.(2[4-9]|[3-9][0-9])` matches 1.24-1.99 generically instead
          # of a hand-listed version set.
          # `[^#\n]*` stops at inline `#` comments.
          matches=$(grep -nE 'onnxruntime[^#\n]*(\b>=|\b==|\b~=)\s*(2\.|1\.(2[4-9]|[3-9][0-9]))' requirements.txt requirements-modal.txt || true)
          if [ -n "$matches" ]; then
            echo "::error::onnxruntime constraint allows a non-existent version (>= 1.24.0 or >= 2.0.0; latest on PyPI is 1.23.2):"
            echo "$matches"
            exit 1
          fi
          echo "OK: every onnxruntime constraint excludes 1.24+ and 2.x"
