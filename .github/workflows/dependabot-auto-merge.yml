name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge minor/patch updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Fetch Dependabot PR metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and merge safe updates
        # Auto-merge:
        #  - direct dep minor/patch bumps,
        #  - indirect (transitive/lockfile-only) bumps, e.g. npm group
        #    updates that touch only package-lock.json. fetch-metadata
        #    reports update-type=null for those, so the semver-minor/patch
        #    condition alone never fired and such PRs sat open forever
        #    (e.g. #130). `gh pr merge --auto` still waits for every
        #    required check, incl. the dependency guardrail, so this is
        #    safe. Major bumps (direct or indirect) stay manual.
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          (steps.metadata.outputs.dependency-type == 'indirect' &&
           steps.metadata.outputs.update-type != 'version-update:semver-major')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
