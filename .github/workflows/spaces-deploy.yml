name: Deploy Static Demo Page to HF Spaces

on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy = build from evaluation_report.json and push; list = show Spaces the token can see"
        required: false
        default: "deploy"
        type: choice
        options: ["deploy", "list"]
      space_id:
        description: "HF Spaces repo id (static Space, free)"
        required: false
        default: "d4oit/tiny-cats-model-demo"
        type: string
  push:
    branches:
      - main
    paths:
      - "evaluation_report.json"

permissions:
  contents: read

concurrency:
  group: spaces-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy static page to HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install huggingface_hub (provides the hf CLI)
        run: pip install --quiet --upgrade huggingface_hub

      - name: Deploy Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ACTION: ${{ inputs.action || 'deploy' }}
          SPACE_ID: ${{ inputs.space_id || 'd4oit/tiny-cats-model-demo' }}
        run: python .github/scripts/deploy_space.py
