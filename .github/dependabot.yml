version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*" 
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pip-dependencies:
        patterns:
          - "*"
    # Ignore onnxruntime versions that do not exist on PyPI yet.
    # Dependabot's version map hallucinated 1.24.x; the latest published
    # release is 1.23.2. Drop this ignore once 1.24+ ships GA so future
    # bumps are picked up normally.
    ignore:
      - dependency-name: "onnxruntime"
        versions: [">= 1.24.0"]
      # Ruff must stay in lockstep with CI + pre-commit (all pinned 0.15.9).
      # Dependabot bumping it independently caused #130's stale formatter
      # failures. Bump manually and in sync across requirements.txt,
      # pyproject.toml, .pre-commit-config.yaml, ci.yml, train.yml.
      - dependency-name: "ruff"
